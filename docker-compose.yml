services:
  db:
    image: mariadb:11.4
    container_name: my-mariadb
    restart: always
    environment:
      MARIADB_USER: obz2n
      MARIADB_PASSWORD: obz2n1234
      MARIADB_DATABASE: database
      MARIADB_ROOT_PASSWORD: root1234
    volumes:
      - "./mariadb-data:/var/lib/mysql"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy